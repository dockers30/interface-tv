<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accueil TV</title>
<style>
:root{color-scheme:dark;--text:#f5f5f7;--muted:#a4a6ad}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#08090d;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{background:radial-gradient(ellipse at 50% -20%,#242633 0,transparent 55%),#08090d}
main{min-height:100vh;padding:5vh 6vw;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:auto}
.logo{font-size:clamp(25px,2.5vw,38px);font-weight:650;letter-spacing:-1.5px}
.logo span{font-weight:300;color:#bfc1c8}
.clock{font-size:clamp(14px,1.2vw,18px);color:#d5d6dc}
section{margin:auto 0}
h1{font-size:clamp(30px,3.5vw,52px);font-weight:650;letter-spacing:-1.8px;margin:0 0 12px}
.subtitle{font-size:clamp(14px,1.3vw,18px);color:var(--muted);margin:0 0 36px}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:clamp(15px,2vw,28px);max-width:1050px}
.app{aspect-ratio:1/1;border:1px solid #ffffff12;border-radius:25px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;cursor:pointer;text-decoration:none;color:white;outline:3px solid transparent;outline-offset:5px;transition:transform .16s,outline-color .16s,background .16s;box-shadow:0 12px 35px #0005}
.app:focus,.app:hover{outline-color:#fff;transform:scale(1.055)}
.app strong{font-size:clamp(15px,1.45vw,22px);letter-spacing:-.5px}
.app small{font-size:12px;color:#ffffffb8}
.netflix{background:linear-gradient(145deg,#292020,#090909)}.netflix strong{color:#ff3040}
.prime{background:linear-gradient(145deg,#1c3859,#101a2a)}
.youtube{background:linear-gradient(145deg,#e63a3a,#9f1010)}
.disney{background:linear-gradient(145deg,#203d79,#10172c)}
.max{background:linear-gradient(145deg,#44348c,#17132d)}
.canal{background:linear-gradient(145deg,#303030,#111)}
.music{background:linear-gradient(145deg,#fb4b68,#a80d3d)}
.music strong{font-size:clamp(14px,1.3vw,20px)}
.tv{background:linear-gradient(145deg,#e5e8ef,#9da8bb);color:#15171c}.tv small{color:#3d414a}
footer{margin-top:auto;padding-top:36px;color:#777b86;font-size:12px}
@media(max-width:650px){main{padding:25px}.apps{grid-template-columns:repeat(3,1fr);gap:15px}.app{border-radius:18px}.subtitle{margin-bottom:24px}}
</style>
</head>
<body>
<main>
<header><div class="logo"> <span>Accueil</span></div><div class="clock" id="clock">--:--</div></header>
<section>
<h1>Vos applications</h1>
<p class="subtitle">Tout votre divertissement, au même endroit.</p>
<nav class="apps" aria-label="Applications">
<a class="app netflix" href="https://www.netflix.com/" target="_blank" rel="noopener" tabindex="0"><strong>NETFLIX</strong><small>Films et séries</small></a>
<a class="app prime" href="https://www.primevideo.com/" target="_blank" rel="noopener" tabindex="0"><strong>prime video</strong><small>Amazon</small></a>
<a class="app youtube" href="https://www.youtube.com/" target="_blank" rel="noopener" tabindex="0"><strong>▶ YouTube</strong><small>Vidéos</small></a>
<a class="app disney" href="https://www.disneyplus.com/" target="_blank" rel="noopener" tabindex="0"><strong>Disney+</strong><small>Films et séries</small></a>
<a class="app max" href="https://www.max.com/" target="_blank" rel="noopener" tabindex="0"><strong>max</strong><small>HBO</small></a>
<a class="app canal" href="https://www.canalplus.com/" target="_blank" rel="noopener" tabindex="0"><strong>CANAL+</strong><small>TV et cinéma</small></a>
<a class="app music" href="https://music.apple.com/" target="_blank" rel="noopener" tabindex="0"><strong>♫ Music</strong><small>Apple Music</small></a>
<a class="app tv" href="#" tabindex="0" onclick="return false"><strong>TV</strong><small>Source TV</small></a>
</nav>
</section>
<footer>Interface personnelle · Sans publicité · Navigation à la télécommande</footer>
</main>
<script>
function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
updateClock();setInterval(updateClock,30000);
document.addEventListener('keydown',e=>{
 const links=[...document.querySelectorAll('.app')],i=links.indexOf(document.activeElement);
 if(i<0)return;
 let next=i;
 if(e.key==='ArrowRight')next=Math.min(i+1,links.length-1);
 else if(e.key==='ArrowLeft')next=Math.max(i-1,0);
 else if(e.key==='ArrowDown')next=Math.min(i+3,links.length-1);
 else if(e.key==='ArrowUp')next=Math.max(i-3,0);
 else return;
 e.preventDefault();links[next].focus();
});
</script>
</body>
</html>
